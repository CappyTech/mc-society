# The villagers. Split from the server compose so the world can be restarted
# without tearing down the agents (and vice versa).
#
#   docker compose -f docker-compose.yml -f docker-compose.village.yml up -d
services:
  # The Chronicle's database: the village's shared memory of who did what to
  # whom. A dedicated instance rather than the household hcs-mongo, deliberately.
  # These are LLM-driven processes on a game server that is open to the LAN, so
  # anything typed in chat reaches them; putting them on hcs-net would give that
  # surface a route to nextcloud, paperless and the finance app. A container
  # costs almost nothing and keeps the blast radius inside this stack.
  mongo:
    image: mongo:8.0
    container_name: mcs-mongo
    restart: unless-stopped
    # No published port at all. The village reaches it by service name over
    # society-net; publishing would put it on the LAN, because Docker writes its
    # iptables rules ahead of ufw's chains.
    environment:
      MONGO_INITDB_ROOT_USERNAME: mcs_root
      MONGO_INITDB_ROOT_PASSWORD: ${CHRONICLE_ROOT_PASSWORD}
      CHRONICLE_VILLAGE_PASSWORD: ${CHRONICLE_VILLAGE_PASSWORD}
    volumes:
      - ./mongo-data:/data/db
      # Runs only on an empty /data/db. Creates the scoped user the village
      # actually authenticates as; root is break-glass and used by nothing.
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    # mongod wants >=64000 and the container default is 1024. This host has
    # already lost a MongoDB to EMFILE mid index-build with the default in
    # place -- WT_PANIC, fassert, and a crash-restart that looked exactly like
    # a client-side network error. See CLAUDE.md.
    ulimits:
      nofile: { soft: 64000, hard: 64000 }
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - society-net

  village:
    image: mc-society-runtime:dev
    container_name: mcs-village
    # Without this the village does not come back after a host reboot: the Paper
    # server does (unless-stopped) and the agents do not, leaving an empty world.
    restart: unless-stopped
    depends_on:
      paper:
        condition: service_healthy
      # Waited for, but the village does not need it to work: with the
      # Chronicle unreachable every villager still takes turns, and the memory
      # block simply renders empty. See society/chronicle/connection.js.
      mongo:
        condition: service_healthy
    environment:
      # Village-wide settings. Per-villager persona, goal and cooldown come from
      # the generated profiles.
      SETTINGS_JSON: >-
        {"host":"mcs-paper","port":25565,"auth":"offline",
         "minecraft_version":"1.21.6","auto_open_ui":false,
         "allow_insecure_coding":false,"base_profile":"survival",
         "max_commands":2,"load_memory":true,
         "num_examples":1,
         "init_message":"You have arrived in the village. Set your standing goal now so you keep working, then begin."}
      PROFILES: >-
        ["./profiles/village/bram.json","./profiles/village/nia.json",
         "./profiles/village/corin.json","./profiles/village/wren.json",
         "./profiles/village/odile.json","./profiles/village/tobias.json",
         "./profiles/village/sable.json","./profiles/village/ivo.json"]
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL}
      LMSTUDIO_API_KEY: ${LMSTUDIO_API_KEY}
      LMSTUDIO_CHAT_MODEL: ${LMSTUDIO_CHAT_MODEL}
      LMSTUDIO_EMBED_MODEL: ${LMSTUDIO_EMBED_MODEL}
      # Unset this and the Chronicle stays inert and silent -- which is the
      # supported way to run the village without a memory.
      CHRONICLE_MONGO_URI: ${CHRONICLE_MONGO_URI}
    volumes:
      - /home/jack/code/mc-society/src:/app/src:ro
      - /home/jack/code/mc-society/profiles:/app/profiles:ro
      # Operator scripts (scripts/say.mjs). Needed because a message containing
      # a command executes without an LLM turn, which is the only way to test a
      # command end-to-end while the inference server is unavailable.
      - /home/jack/code/mc-society/scripts:/app/scripts:ro
      - /home/jack/code/mc-society/keys.json:/app/keys.json:ro
      # PROFILE OVERRIDES ARE UNMOUNTED (2026-08-10). They pinned four villagers
      # to a second LM Studio instance by its ":2" identifier; only one instance
      # is loaded now, so all four had drifted to the SAME model id as the repo
      # profiles and pinned nothing.
      #
      # They are not merged, they REPLACE the whole profile file -- so as stale
      # full copies they silently froze four villagers' cooldown at 3000ms when
      # the roster raised it to 12000, and would freeze any future persona change
      # the same way. Concurrency is now handled in code and across all eight
      # villagers by src/society/inferenceSlots.js, which is a better home for it
      # than four hand-copied files.
      #
      # ./profile-overrides/ and scripts/sync-profile-overrides.mjs are kept for
      # when a second instance is loaded again. Re-copy from the repo profiles
      # before remounting; do not trust what is in there now.
      # Agent memory lives here. Unmounted it dies with the container, so every
      # relaunch was total amnesia -- which defeats the whole point of a village
      # that remembers. Phase 2 moves this into the Chronicle; until then the
      # volume is what makes memory outlive a restart.
      - ./bots:/app/bots
    working_dir: /app
    command: ["node", "main.js"]
    # Liveness is "a villager completed a turn", not "the process exists".
    #
    # The failure this catches actually happened: with the model loaded at a
    # 768-token context, all eight villagers connected, showed up in the player
    # list, and failed every single turn for hours while this container read
    # `Up` and the process stayed healthy by any ordinary measure.
    #
    # It marks the container unhealthy and deliberately does not restart it --
    # when the cause is the inference server, restarting the village fixes
    # nothing and a restart loop would bury the signal.
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 60s
      timeout: 10s
      retries: 3
      # Eight agents have to connect, load memory and take a first turn before
      # any beat exists; a short start period reports a false failure at boot.
      start_period: 300s
    # The village is the busiest thing on this host (~32% CPU steady, ~2 GiB).
    # Nothing capped it, so a runaway agent loop could take the box down with
    # Paper's 6 GiB heap alongside it.
    mem_limit: 4g
    memswap_limit: 4g
    networks:
      - society-net

# Must match the definition in docker-compose.yml -- the two files merge into one
# project, so a mismatched (e.g. external) declaration here fails the merge.
networks:
  society-net:
    name: society-net
